<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrilhoLanding</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="CSS/LandingPage.css">
</head>
<body>

  <section class="hero-section position-relative overflow-hidden d-flex align-items-center justify-content-center py-5">
    
    <img src="img/banner.webp" alt="Banner Trail Running" class="hero-bg-img">

    <div class="container position-relative hero-content">
      <div class="row justify-content-center">
        <div class="col-11 col-md-9 col-lg-7">
          <div class="hero-overlay-card p-4 p-md-5 text-white text-center shadow">
            
            <h1 class="fw-bold mb-3 fs-2">Juntos vamos mais longe!</h1>
            
            <p class="mb-4 text-light px-md-3">
              Inscreve-te agora e acumula kms de corrida e trilho, compete no ranking e ganha prêmios!
            </p>

            <form action="#" method="POST">
              <div class="mb-3">
                <input type="text" class="form-control form-control-lg text-center" placeholder="Nome" name="nome" required>
              </div>
              <div class="mb-3">
                <input type="email" class="form-control form-control-lg text-center" placeholder="Email" name="email" required>
              </div>
              <div class="mb-4">
                <input type="tel" class="form-control form-control-lg text-center" placeholder="Contacto" name="contacto" required>
              </div>
              <button type="submit" class="btn btn-warning btn-lg w-100 fw-bold text-dark py-3">
                Enviar
              </button>
            </form>

          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="rankings-section py-4 text-center">
    <div class="container">
      <h2 class="fw-bold fs-4 mb-4 text-dark">Rankings</h2>
      
      <div class="row justify-content-center g-4">
        <div class="col-4 col-md-3">
          <p class="fw-bold text-dark mb-2">1º João</p>
          <img src="img/person1.png" alt="1º Lugar - João" class="rounded-circle podium-img shadow-sm">
        </div>

        <div class="col-4 col-md-3">
          <p class="fw-bold text-dark mb-2">2º Mariana</p>
          <img src="img/person2.png" alt="2º Lugar - Mariana" class="rounded-circle podium-img shadow-sm">
        </div>

        <div class="col-4 col-md-3">
          <p class="fw-bold text-dark mb-2">3º Sofia</p>
          <img src="img/person3.png" alt="3º Lugar - Sofia" class="rounded-circle podium-img shadow-sm">
        </div>
      </div>
    </div>
  </section>

  <section class="container-fluid p-0">
    <div class="row g-0">
      <div class="col-md-6">
        <img src="img/galeria1.jpg" alt="Trail runner na floresta" class="gallery-img">
      </div>
      <div class="col-md-6">
        <img src="img/galeria2.jpg" alt="Runner na montanha" class="gallery-img">
      </div>
    </div>
  </section>

</body>
</html>
